# =====================================================
#   SonarCloud
#   https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/github-actions-for-sonarcloud/
# =====================================================
sonar.projectKey=gitify-app_website
sonar.organization=gitify-app
sonar.projectDescription=The source code of gitify.io.


# =====================================================
#   Source Configuration
#   https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/
# =====================================================
sonar.sources=./src
sonar.tests=./src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.png, **/*.jpg, **/*.jpeg, **/*.gif, **/*.webp, **/*.avif, **/*.ico, **/*.bmp, **/*.test.ts
sonar.typescript.tsconfigPaths=./tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info


# =====================================================
#   Project Metadata
#   https://docs.sonarsource.com/sonarcloud/advanced-setup/ci-based-analysis/sonarscanner-for-npm/configuring/
# =====================================================
sonar.links.homepage=https://gitify.io
sonar.links.ci=https://github.com/gitify-app/website/actions
sonar.links.scm=https://github.com/gitify-app/website
sonar.links.issue=https://github.com/gitify-app/website/issues
