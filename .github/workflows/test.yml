name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  test:
    name: Unit Tests [node:test]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@v3.1.1
        with:
          node-version-file: ".nvmrc"
          cache: true
          require-lockfile: true

      - run: pnpm test
